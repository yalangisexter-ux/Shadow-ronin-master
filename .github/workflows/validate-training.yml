name: Validate Lone-Wolf-Howler sources

on:
  push:
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/validate-training.yml"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/validate-training.yml"

permissions:
  contents: read

jobs:
  syntax-and-output-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pipeline and inference sources
        run: |
          python -m py_compile \
            Lone-Wolf-Howler-End-to-End-Recovery-First-Fixed.py \
            Lone-Wolf-Howler-End-to-End-Recovery-First-Test.py \
            Shadow-Ronin-4B-End-to-End-Recovery-First-Master.py \
            Lone-Wolf-Howler-v10.1-Completion-Release.py \
            lone_wolf_inference.py
      - name: Run output regression tests
        run: python -m unittest discover -s tests -v
