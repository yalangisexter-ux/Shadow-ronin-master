name: Sync Lone-Wolf-Howler scripts to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "Lone-Wolf-Howler-End-to-End-Recovery-First-Fixed.py"
      - "Lone-Wolf-Howler-End-to-End-Recovery-First-Test.py"
      - "lone_wolf_inference.py"
      - "tests/**"
      - "kaggle/lone-wolf-howler-retrain/**"
      - ".github/workflows/sync-scripts-to-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing repository secret HF_TOKEN. Add a Hugging Face write token in GitHub Actions secrets."
            exit 1
          fi

      - name: Upload scripts to Hugging Face model repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub>=0.30.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = os.environ.get("HF_REPO", "").strip() or "aryansexter/Lone-Wolf-Howler"
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="model", exist_ok=True, private=True)

          files = [
              ("Lone-Wolf-Howler-End-to-End-Recovery-First-Fixed.py",
               "scripts/Lone-Wolf-Howler-End-to-End-Recovery-First-Fixed.py"),
              ("Lone-Wolf-Howler-End-to-End-Recovery-First-Test.py",
               "scripts/Lone-Wolf-Howler-End-to-End-Recovery-First-Test.py"),
              ("lone_wolf_inference.py", "scripts/lone_wolf_inference.py"),
              ("tests/test_lone_wolf_inference.py", "scripts/tests/test_lone_wolf_inference.py"),
              ("kaggle/lone-wolf-howler-retrain/Lone-Wolf-Howler-Retrain.ipynb",
               "scripts/Lone-Wolf-Howler-Retrain.ipynb"),
          ]
          for local_path, path_in_repo in files:
              if not os.path.isfile(local_path):
                  raise FileNotFoundError(f"Required script is missing: {local_path}")
              api.upload_file(
                  path_or_fileobj=local_path,
                  path_in_repo=path_in_repo,
                  repo_id=repo_id,
                  repo_type="model",
                  commit_message=f"Sync {path_in_repo} from GitHub",
              )
              print(f"Uploaded {local_path} -> {repo_id}/{path_in_repo}")
          print(f"Successfully synced scripts to https://huggingface.co/{repo_id}")
          PY
