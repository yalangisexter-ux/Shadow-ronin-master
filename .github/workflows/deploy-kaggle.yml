name: Deploy Lone-Wolf-Howler to Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-kaggle-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required Kaggle secrets
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_USERNAME" || (echo "Missing repository secret KAGGLE_USERNAME" >&2; exit 1)
          test -n "$KAGGLE_KEY" || (echo "Missing repository secret KAGGLE_KEY" >&2; exit 1)
      - name: Configure Kaggle CLI
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python -m pip install --upgrade kaggle
          mkdir -p ~/.kaggle
          python - <<'PY'
          import json, os
          p = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(p, "w", encoding="utf-8") as f:
              json.dump({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]}, f)
          os.chmod(p, 0o600)
          PY
      - name: Set notebook owner and validate metadata
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - <<'PY'
          import json, os
          path = "kaggle/lone-wolf-howler-retrain/kernel-metadata.json"
          with open(path, encoding="utf-8") as f:
              meta = json.load(f)
          meta["id"] = os.environ["KAGGLE_USERNAME"] + "/lone-wolf-howler-retrain"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          PY
      - name: Push notebook and start Kaggle run
        run: kaggle kernels push -p kaggle/lone-wolf-howler-retrain
