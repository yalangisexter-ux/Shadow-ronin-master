name: Deploy Lone-Wolf-Howler to Kaggle

on:
  workflow_dispatch:
  push:
    paths:
      - "kaggle/lone-wolf-howler-retrain/**"
      - "Lone-Wolf-Howler-End-to-End-Recovery-First-Fixed.py"
      - "lone_wolf_inference.py"
      - ".github/workflows/deploy-kaggle.yml"

permissions:
  contents: read

jobs:
  push-kaggle-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required Kaggle secrets
        shell: bash
        env:
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_USER" || (echo "Missing repository secret KAGGLE_USER" >&2; exit 1)
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing repository secret KAGGLE_API_TOKEN" >&2; exit 1)
      - name: Configure Kaggle CLI
        shell: bash
        env:
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -m pip install --upgrade kaggle
          mkdir -p ~/.kaggle
          # Support modern Kaggle access tokens (KGAT_...)
          echo -n "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          # Also write legacy kaggle.json for CLI fallback compatibility
          python - <<'PY'
          import json, os
          p = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(p, "w", encoding="utf-8") as f:
              json.dump({"username": os.environ["KAGGLE_USER"], "key": os.environ["KAGGLE_API_TOKEN"]}, f)
          os.chmod(p, 0o600)
          PY
      - name: Set notebook owner metadata
        shell: bash
        env:
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
        run: |
          python - <<'PY'
          import json, os

          meta_path = "kaggle/lone-wolf-howler-retrain/kernel-metadata.json"
          with open(meta_path, encoding="utf-8") as f:
              meta = json.load(f)
          meta["id"] = os.environ["KAGGLE_USER"] + "/lone-wolf-howler-guarded-retraining"
          meta["title"] = "Lone-Wolf-Howler Guarded Retraining"
          with open(meta_path, "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          PY
      - name: Push notebook and start Kaggle run
        shell: bash
        env:
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          for i in {1..6}; do
            set +e
            out=$(kaggle kernels push -p kaggle/lone-wolf-howler-retrain 2>&1)
            push_status=$?
            set -e
            echo "$out"
            if echo "$out" | grep -qi "successfully pushed"; then
              echo "Push to Kaggle succeeded!"
              exit 0
            fi
            if echo "$out" | grep -Eiq "Maximum (batch GPU session count|weekly GPU quota)"; then
              echo "Kaggle refused to start the kernel because GPU capacity or weekly quota is exhausted. No training or GGUF export started." >&2
              exit 1
            fi
            if ! echo "$out" | grep -qi "error"; then
              echo "Kaggle push failed with status $push_status and no recognized transient error." >&2
              exit 1
            fi
            if [ "$i" -lt 6 ]; then
              echo "Transient Kaggle push failure (attempt $i/6). Waiting 30s before retry..."
              sleep 30
            fi
          done
          echo "Failed to push kernel to Kaggle after 6 transient retries." >&2
          exit 1
